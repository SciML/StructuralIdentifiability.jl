name: "Tests"

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    # Temporary: i686 LibGit2 needs /etc/gitconfig + clean clones for URL [sources]
    # (SciML/.github#137). Switch back to SciML/.github@master after #137 merges.
    uses: "ChrisRackauckas-Claude/.github/.github/workflows/grouped-tests.yml@i686-gitconfig-consumable"
    secrets: "inherit"
